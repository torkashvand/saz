name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yaml'

  backend:
    name: Backend (lint, types, tests)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SUSPENSION_SWEEP_ENABLED: "False"
      # Tests create one isolated database per xdist worker from this base URL.
      TEST_DATABASE_URL: "postgresql+psycopg2://saz:saz@localhost:5432/saz_test"
      DATABASE_URL: "postgresql+psycopg2://saz:saz@localhost:5432/saz_test"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saz
          POSTGRES_PASSWORD: saz
          POSTGRES_DB: saz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saz -d saz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Lint, format, types (pre-commit)
        # Run from repo root because .pre-commit-config.yaml lives there.
        # Use --project backend so `uv run` picks up the backend venv that
        # `uv sync` populated above.
        working-directory: ${{ github.workspace }}
        run: uv run --project backend pre-commit run --all-files --show-diff-on-failure

      - name: Tests (pytest)
        run: uv run pytest -n auto -q

  frontend:
    name: Frontend (lint, types, build)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

  ci:
    name: CI
    needs: [backend, frontend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate status
        run: |
          backend="${{ needs.backend.result }}"
          frontend="${{ needs.frontend.result }}"
          echo "backend=$backend frontend=$frontend"
          # Pass if each required job either succeeded or was skipped
          # (path filter says nothing in that area changed). Fail on any
          # failure or cancellation.
          for r in "$backend" "$frontend"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job did not succeed (got '$r')"; exit 1 ;;
            esac
          done
          echo "All required checks passed."