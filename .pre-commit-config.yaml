# Monorepo pre-commit config. Hooks run from the repository root.
# Python tooling is scoped to backend/, JS/TS tooling to frontend/.
#
# One-time setup per clone:
#   pre-commit install                    # registers the git hook
#   cd backend  && uv sync                # backend deps (ruff/mypy/uv-lock)
#   cd frontend && npm ci                 # frontend deps (tsc/eslint/prettier)

repos:
  # ---------------------------------------------------------------------------
  # Backend (Python) — scoped to backend/**
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.6
    hooks:
      - id: uv-lock
        files: ^backend/(uv\.lock|pyproject\.toml|uv\.toml)$
        args: ['--project', 'backend']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
        files: ^backend/.+\.(py|pyi)$
        args: [--fix, --show-fixes]
      - id: ruff-format
        files: ^backend/.+\.(py|pyi)$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/.+\.py$
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - pydantic>=2.0
          - sqlalchemy>=2.0
          - alembic>=1.13
          - fastapi>=0.100
          - cryptography>=41.0
          - litellm>=1.0
          - structlog>=23.0

  # ---------------------------------------------------------------------------
  # Frontend hooks — fire only when frontend/** files are staged, and quietly
  # skip when frontend/node_modules is missing (so a backend-only contributor
  # is not forced to install Node tooling).
  #
  # Enable locally with: cd frontend && npm ci   (one time)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: frontend-typecheck
        name: frontend typecheck (tsc --noEmit)
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontend/.+\.(ts|tsx)$
        entry: bash
        args:
          - -c
          - |
            if [ ! -d frontend/node_modules ]; then
              echo "skip: frontend/node_modules missing (run 'cd frontend && npm ci' to enable)"
              exit 0
            fi
            cd frontend && npm run --silent typecheck

      - id: frontend-lint
        name: frontend lint (next lint)
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontend/.+\.(ts|tsx|js|jsx)$
        entry: bash
        args:
          - -c
          - |
            if [ ! -d frontend/node_modules ]; then
              echo "skip: frontend/node_modules missing (run 'cd frontend && npm ci' to enable)"
              exit 0
            fi
            cd frontend && npm run --silent lint

      - id: frontend-format
        name: frontend format (prettier --check)
        language: system
        pass_filenames: false
        require_serial: true
        files: ^frontend/.+\.(ts|tsx|js|jsx|json|css|md|yaml|yml)$
        entry: bash
        args:
          - -c
          - |
            if [ ! -d frontend/node_modules ]; then
              echo "skip: frontend/node_modules missing (run 'cd frontend && npm ci' to enable)"
              exit 0
            fi
            cd frontend && npm run --silent format:check
