repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.6
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
        args: [--fix, --show-fixes]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - pydantic>=2.0
          - sqlalchemy>=2.0
          - alembic>=1.13
          - fastapi>=0.100
          - cryptography>=41.0
          - litellm>=1.0
          - structlog>=23.0
