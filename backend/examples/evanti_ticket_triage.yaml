schema_version: 1

# Evanti / Ivanti Ticket Triage – Agentic demo flow for Saz
flow:
  name: evanti_ticket_triage
  version: "1.0"
  description: |
    Agentic triage for Ivanti/Evanti incident tickets.

    For each new ticket this flow should:
      - understand context, impact and urgency from free-text
      - classify and route to the right internal team
      - draft a clean internal note and suggested next actions
      - optionally update the ticket in Ivanti via API
    Always keep a human in the loop: never auto-resolve or close tickets.

  labels:
    domain: "support"
    system: "ivanti"
    category: "ticket_triage"
    demo: "true"

  owners:
    - "noc-team"
    - "automation-platform"

form:
  fields:
    - name: ticket_id
      type: string
      required: true
      description: Ivanti ticket ID

    - name: ticket_title
      type: string
      required: true
      description: Short description / title from Ivanti

    - name: ticket_description
      type: string
      required: true
      description: Full ticket description (user free-text)

    - name: service
      type: string
      required: false
      description: Service / CI name (if available)

    - name: impact
      type: string
      required: false
      enum: [low, medium, high, critical]
      description: Business impact as reported in Ivanti

    - name: urgency
      type: string
      required: false
      enum: [low, medium, high, critical]
      description: Urgency as reported in Ivanti

    - name: source
      type: string
      required: false
      description: Channel (email, portal, phone, monitoring, other)

triggers:
  manual: true
  webhook:
    path: "/ivanti/ticket-created"
#    method: POST
    signature_header: "X-Ivanti-Signature"

telemetry:
  # brief = plan + steps + tools + policy + critiques + usage
  trace_level: "brief"
  # demo: sample every run
  sample_rate: 1.0

workflow:
  planner_mode: agentic
  # In agentic mode the LLM planner will:
  #   - analyze ticket_description, impact, urgency, service, source
  #   - call ai.extract / ai.route / ai.summarize to triage the ticket
  #   - call http_request to Ivanti REST API (read / update the ticket)
  #   - store an artifact with triage summary, routing decision and API calls
  # A concrete execution plan is generated and stored per run.
  steps: []

policies:
  # Hard budget per run for planning + AI steps
  budget_usd: 0.25

  # Per-tool rate limits (sane defaults for a demo)
  rate_limits:
    ai.extract:
      rpm: 30
    ai.route:
      rpm: 30
    ai.summarize:
      rpm: 30
    http_request:
      rpm: 10

  # Privacy: treat everything as PII by default, tokenize before LLM
  pii:
    allow: false
    tokenize_model_inputs: true

credentials:
  uses:
    # Should be created in Saz CredentialService and hold the Ivanti API token
    - ivanti_api_token
