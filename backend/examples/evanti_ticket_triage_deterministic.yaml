schema_version: 1

flow:
  name: evanti_ticket_triage
  version: "1.0-deterministic"
  description: |
    Deterministic Ivanti/Evanti ticket triage with AI-assisted
    extraction, routing, risk scoring, and ticket update.

    The plan is fixed in YAML; the LLM is used only inside ai.* steps
    (no agentic planning).

  labels:
    domain: "support"
    system: "ivanti"
    category: "ticket_triage"
    demo: "true"
    planner_mode: "deterministic"

  owners:
    - "noc-team"
    - "automation-platform"

form:
  fields:
    - name: ticket_id
      type: string
      required: true
      description: Ivanti/Evanti ticket ID

    - name: ticket_title
      type: string
      required: true
      description: Short description / title from Ivanti

    - name: ticket_description
      type: string
      required: true
      description: Full ticket description (user free-text)

    - name: service
      type: string
      required: false
      description: Service / CI name (if available)

    - name: impact
      type: string
      required: false
      enum: [low, medium, high, critical]
      description: Business impact as recorded in Ivanti

    - name: urgency
      type: string
      required: false
      enum: [low, medium, high, critical]
      description: Urgency as recorded in Ivanti

    - name: source
      type: string
      required: false
      description: Channel (email, portal, phone, monitoring, other)

triggers:
  manual: true
  webhook:
    path: "/ivanti/ticket-created"
#    method: POST
    signature_header: "X-Ivanti-Signature"

telemetry:
  trace_level: "brief"
  sample_rate: 1.0

workflow:
  planner_mode: deterministic
  steps:
    # Step 1 – Extract structured context from the ticket text
    - id: extract_ticket_context
      type: ai.extract
      instruction: |
        From this Ivanti/Evanti incident, extract structured fields
        that help triage and route the ticket.

        Use the title, description, impact, urgency, service and source.
        Focus on network / infrastructure context.

        Return:
          - category: short label for the type of issue
            (e.g. vpn_issue, routing_issue, firewall_issue,
             monitoring_alert, application_issue, other)
          - inferred_impact: one of [low, medium, high, critical]
            inferred from the text if impact is missing or vague
          - inferred_urgency: one of [low, medium, high, critical]
          - service_guess: best guess of affected service or CI
          - location: POP / site or region if mentioned
          - is_outage: true if this looks like a broader outage
          - key_symptoms: bullet points of concrete symptoms
          - probable_cause: short hypothesis, if any
          - suggested_initial_checks: 3–6 concrete checks NOC can run
      params:
        data:
          ticket_id: "{{ $form.ticket_id }}"
          title: "{{ $form.ticket_title }}"
          description: "{{ $form.ticket_description }}"
          impact: "{{ $form.impact }}"
          urgency: "{{ $form.urgency }}"
          service: "{{ $form.service }}"
          source: "{{ $form.source }}"
      schema:
        type: object
        properties:
          category:
            type: string
          inferred_impact:
            type: string
            enum: [low, medium, high, critical]
          inferred_urgency:
            type: string
            enum: [low, medium, high, critical]
          service_guess:
            type: string
          location:
            type: string
          is_outage:
            type: boolean
          key_symptoms:
            type: array
            items:
              type: string
          probable_cause:
            type: string
          suggested_initial_checks:
            type: array
            items:
              type: string
        required:
          - category
          - inferred_impact
          - inferred_urgency
          - key_symptoms
      temperature: 0.1
      max_tokens: 512

    # Step 2 – Route ticket to the right handling team
    - id: route_ticket
      type: ai.route
      instruction: |
        Choose the MOST appropriate handling team for this ticket.
        Consider: category, impact, urgency, service, outage flag and symptoms.

        Possible routes:
          - vpn_team           (VPN / remote access issues)
          - firewall_team      (ACLs, ports, security policies)
          - noc_shift          (generic NOC triage / coordination)
          - platform_team      (infrastructure platform / automation issues)
          - service_desk       (end-user/account questions)
          - unknown            (cannot decide; needs manual routing)
      params:
        data:
          category: "{{ $step('extract_ticket_context').category }}"
          inferred_impact: "{{ $step('extract_ticket_context').inferred_impact }}"
          inferred_urgency: "{{ $step('extract_ticket_context').inferred_urgency }}"
          is_outage: "{{ $step('extract_ticket_context').is_outage }}"
          service_guess: "{{ $step('extract_ticket_context').service_guess }}"
          impact_from_form: "{{ $form.impact }}"
          urgency_from_form: "{{ $form.urgency }}"
      branches_enum:
        - vpn_team
        - firewall_team
        - noc_shift
        - platform_team
        - service_desk
        - unknown
      temperature: 0.1
      max_tokens: 256

    # Step 3 – Score risk / complexity for prioritisation
    - id: score_risk
      type: ai.score
      instruction: |
        Score the operational risk / complexity of this incident
        from 0.0 (low risk, simple) to 1.0 (high risk, complex).

        Take into account:
          - number of users / scope (if mentioned)
          - whether it looks like an outage
          - impact / urgency (from form + inferred)
          - type of service (network core vs edge vs non-critical)
      params:
        data:
          title: "{{ $form.ticket_title }}"
          description: "{{ $form.ticket_description }}"
          category: "{{ $step('extract_ticket_context').category }}"
          inferred_impact: "{{ $step('extract_ticket_context').inferred_impact }}"
          inferred_urgency: "{{ $step('extract_ticket_context').inferred_urgency }}"
          is_outage: "{{ $step('extract_ticket_context').is_outage }}"
      rubric: |
        0.0–0.3  : Low-risk, simple, single user, clear workaround
        0.3–0.6  : Moderate impact, some uncertainty, needs investigation
        0.6–0.8  : High impact or complex technical analysis required
        0.8–1.0  : Broad outage or critical infrastructure / security risk
      temperature: 0.1
      max_tokens: 512

    # Step 4 – Generate a clean triage summary for the ticket
    - id: generate_triage_summary
      type: ai.generate
      instruction: |
        Write a short internal triage note that could be added to the
        Ivanti/Evanti ticket.

        Include:
          - one-line summary of the problem
          - scope and impact (who/what is affected)
          - inferred category and routed team
          - risk/complexity level (low/medium/high/critical)
          - 3–6 concrete next steps for the NOC/handling team
        Target audience: NOC, network engineers, SREs.
        Keep it concise and factual.
      params:
        data:
          ticket_id: "{{ $form.ticket_id }}"
          title: "{{ $form.ticket_title }}"
          description: "{{ $form.ticket_description }}"
          category: "{{ $step('extract_ticket_context').category }}"
          inferred_impact: "{{ $step('extract_ticket_context').inferred_impact }}"
          inferred_urgency: "{{ $step('extract_ticket_context').inferred_urgency }}"
          service_guess: "{{ $step('extract_ticket_context').service_guess }}"
          is_outage: "{{ $step('extract_ticket_context').is_outage }}"
          key_symptoms: "{{ $step('extract_ticket_context').key_symptoms }}"
          probable_cause: "{{ $step('extract_ticket_context').probable_cause }}"
          suggested_initial_checks: "{{ $step('extract_ticket_context').suggested_initial_checks }}"
          routed_team: "{{ $step('route_ticket').route }}"
          risk_score: "{{ $step('score_risk').score }}"
      word_cap: 250
      temperature: 0.3
      max_tokens: 1024

    # Step 5 – Update the ticket in Ivanti/Evanti via HTTP API
    - id: update_ticket_in_evanti
      type: tool.call
      tool: http_request
      description: Add triage note and routing info back into Ivanti/Evanti
      params:
        method: POST
        url: "http://0.0.0.0:8001/api/tickets/{{ $form.ticket_id }}/triage-note"
        headers:
          Authorization: "Bearer {{ $secret('ivanti_api_token') }}"
          Content-Type: "application/json"
        body:
          ticketId: "{{ $form.ticket_id }}"
          routedTeam: "{{ $step('route_ticket').route }}"
          category: "{{ $step('extract_ticket_context').category }}"
          impactFromForm: "{{ $form.impact }}"
          urgencyFromForm: "{{ $form.urgency }}"
          inferredImpact: "{{ $step('extract_ticket_context').inferred_impact }}"
          inferredUrgency: "{{ $step('extract_ticket_context').inferred_urgency }}"
          riskScore: "{{ $step('score_risk').score }}"
          summaryNote: "{{ $step('generate_triage_summary') }}"
          source: "{{ $form.source }}"
          serviceGuess: "{{ $step('extract_ticket_context').service_guess }}"
          isOutage: "{{ $step('extract_ticket_context').is_outage }}"
      expect:
        type: object
        properties:
          status:
            type: string
          note_id:
            type: string

    # Step 6 – Store everything as an artifact for audit/debug
    - id: store_ticket_artifact
      description: "Store everything as an artifact for audit/debug"
      type: artifact.store
      params:
        name: "triage-{{ $form.ticket_id }}-{{ $run.id }}.json"
        content:
          ticket_id: "{{ $form.ticket_id }}"
          title: "{{ $form.ticket_title }}"
          description: "{{ $form.ticket_description }}"
          form:
            impact: "{{ $form.impact }}"
            urgency: "{{ $form.urgency }}"
            service: "{{ $form.service }}"
            source: "{{ $form.source }}"
          extracted: "{{ $step('extract_ticket_context') }}"
          routing: "{{ $step('route_ticket') }}"
          risk: "{{ $step('score_risk') }}"
          triage_summary: "{{ $step('generate_triage_summary') }}"
          evanti_update: "{{ $step('update_ticket_in_evanti') }}"

policies:
  budget_usd: 0.25
  rate_limits:
    http_request:
      rpm: 10
    ai.extract:
      rpm: 60
    ai.route:
      rpm: 60
    ai.score:
      rpm: 60
    ai.generate:
      rpm: 30
  pii:
    allow: false
    tokenize_model_inputs: true

credentials:
  uses:
    - ivanti_api_token
