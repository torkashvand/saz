# Example 1: HTTP API workflow with conditional branching
# Use case: Check service health, conditionally trigger alert

flow:
  name: service_health_monitor
  version: "1.0"
  description: Monitor service health and alert if down

form:
  fields:
    - name: service_url
      type: text
      required: true
      description: URL of service to monitor
    - name: alert_webhook
      type: text
      required: true
      description: Webhook URL for alerts

triggers:
  manual: true
  schedule:
    cron: "*/5 * * * *"  # Every 5 minutes

workflow:
  planner_mode: deterministic
  steps:
    - id: health_check
      type: tool.call
      tool: http_request
      description: Check service health endpoint
      params:
        method: GET
        url: "{{ $form.service_url }}/health"
        timeout: 10
      expect:
        type: object
        properties:
          status_code:
            type: integer
      retry:
        attempts: 2
        backoff: linear
        max_delay: 5

    - id: check_status
      type: condition
      description: Evaluate if service is healthy
      if: "{{ toInt($step('health_check').status_code) }} == 200"
      continue_on_fail: false

    - id: send_alert
      type: tool.call
      tool: http_request
      description: Send alert if service is down
      params:
        method: POST
        url: "{{ $form.alert_webhook }}"
        body:
          alert: "Service down"
          service: "{{ $form.service_url }}"
          timestamp: "{{ $env('TIMESTAMP') }}"
          status_code: "{{ $step('health_check').status_code }}"
      expect:
        type: object

    - id: store_alert_log
      type: artifact.store
      description: Store alert log
      params:
        name: "alert_{{ $form.service_url }}_{{ $env('TIMESTAMP') }}"
        content:
          service: "{{ $form.service_url }}"
          alerted_at: "{{ $env('TIMESTAMP') }}"

policies:
  budget:
    max_tokens: 1000
    max_cost_usd: 0.01
    max_steps: 10
    max_time_seconds: 60
  rate_limits:
    max_requests_per_minute: 20
  pii:
    enforce_redaction: false

credentials:
  uses: []
