[project]
name = "saz"
version = "0.2.0"
description = "Agentic Workflow Platform - LLM-powered autonomous workflows"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "structlog>=24.1.0",
    "litellm>=1.50.0",
    "httpx>=0.26.0",
    "pyjwt>=2.8.0",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "cryptography>=46.0.3",
    "APScheduler>=3.11.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "saz",
    "saz.agents",
    "saz.tools",
    "saz.policies",
    "saz.db"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "pytest-xdist==3.7.0",
    "httpx>=0.26.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # Allow Depends() in FastAPI function defaults
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["saz"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true
exclude = '''
^(alembic|migrations|tests|build|dist|scripts|docs)(/|$)
|.*/generated/
'''

[[tool.mypy.overrides]]
module = ["alembic.*", "migrations.*", "tests.*"]
ignore_errors = true
