[project]
name = "saz"
version = "0.2.0"
description = "Agentic Workflow Platform - LLM-powered autonomous workflows"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "structlog>=24.1.0",
    "litellm>=1.50.0",
    "httpx>=0.26.0",
    "pyjwt>=2.8.0",
    "jsonschema>=4.20.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.9",
    "cryptography>=46.0.3",
    "APScheduler>=3.11.0",
    "ansible-runner>=2.4.0",
    "ansible-core>=2.16",
    "pydantic-settings>=2.12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "saz",
    "saz.agents",
    "saz.tools",
    "saz.policies",
    "saz.db"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.4",
    "pytest-cov>=4.1.0",
    "pytest-xdist==3.7.0",
    "httpx>=0.26.0",
    "pre-commit>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    # Tests that exercise the executor with the real LiteLLMPort cause
    # litellm to re-serialize its OpenAI-compatible response objects.
    # Pydantic complains because litellm's Message/Choices model has
    # fewer fields than the canonical schema. Cosmetic, third-party.
    "ignore:Pydantic serializer warnings:UserWarning:pydantic.main",
]

# ---------------------------------------------------------------------------
# Coverage configuration.
# Run:   coverage run -m pytest -n 0 && python scripts/check_coverage.py
# (-n 0 because pytest-xdist + coverage need extra wiring to combine workers;
# the helper script asserts per-package thresholds from the report.)
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["saz"]
omit = [
    "saz/telemetry/*",
    "saz/__init__.py",
    "saz/api/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
skip_covered = false
precision = 1

# ---------------------------------------------------------------------------
# Mutation testing config. Run with: mutmut run (slow; not for default CI).
# Targets the failure-sensitive modules — these are the gates whose silent
# regression would let unsafe behavior through.
# ---------------------------------------------------------------------------
[tool.mutmut]
paths_to_mutate = [
    "saz/api/routes/runs.py",
    "saz/agents/ai_ops.py",
    "saz/agents/executor.py",
    "saz/compiler/dsl.py",
    "saz/policies/policy_engine.py",
    "saz/policies/rate_limiter.py",
    "saz/repositories/write/run_repository.py",
    "saz/repositories/write/step_repository.py",
    "saz/services/flow_service.py",
    "saz/services/run_service.py",
]
runner = "python -m pytest -x -q tests/regression tests/unit tests/services"
tests_dir = "tests"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]  # Allow Depends() in FastAPI function defaults
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["saz"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_equality = true
ignore_missing_imports = true
exclude = '''
^(alembic|migrations|build|dist|scripts|docs)(/|$)
|.*/generated/
'''

