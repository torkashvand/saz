; Saz change-approval demo inventory.
;
; Single localhost host using a local connection — no SSH or remote
; credentials are required to run the demo. Operators can replace this
; with a real inventory by setting SAZ_DEMO_ANSIBLE_INVENTORY (see
; backend/saz/examples/README.md).

[demo]
; ansible_python_interpreter=auto_silent lets Ansible auto-discover Python on
; whatever box the demo runs on (macOS Homebrew, Linux /usr/bin/python3, etc.)
; without warnings. A hard-coded path or the /usr/bin/env trick breaks on macOS,
; where python3 typically lives under /opt/homebrew or /usr/local.
localhost ansible_connection=local ansible_python_interpreter=auto_silent