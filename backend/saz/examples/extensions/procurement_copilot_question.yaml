# EXTENSION-ONLY EXAMPLE — NOT runnable with the default registry.
#
# This flow references custom tools (contracts_search, erp_spend_query,
# supplier_risk_lookup) that Saz does NOT ship. To run it you must register
# real implementations via ToolRegistry.register_custom_tool(...).
#
# Note: ai.* steps are single-shot completions; they do NOT call tools. Tool
# use must be expressed as explicit `tool.call` steps (see store_report below).
# This file is kept as an integration pattern, not a ready-to-run demo, so it
# lives outside examples/unified/ and is not loaded by the template manager.

meta:
  id: procurement_copilot_question
  title: "Procurement Copilot (extension-only)"
  description: >-
    Extension pattern showing how a procurement copilot could be wired on top
    of custom RAG/ERP tools. Requires registering contracts_search,
    erp_spend_query and supplier_risk_lookup before it can run.
  tags: ["procurement", "agentic", "extension-only"]
  complexity: "advanced"
  recommended: false
  extension_only: true

schema_version: 1

flow:
  name: procurement_copilot_question
  version: "1.0"
  description: >
    Agentic procurement copilot. Given a free-text question, an analysis step
    classifies the request and an answer step drafts a response. Tool-backed
    retrieval (contracts/ERP/risk) requires custom tools to be registered.

form:
  fields:
    - name: question
      type: string
      widget: textarea
      required: true
      description: "Ask anything about vendors, contracts, spend or risk."

    - name: category_hint
      type: string
      required: false
      description: "Optional: spend category (e.g. SaaS, network, consulting)."

workflow:
  planner_mode: agentic

  steps:
    - id: analyze_question
      type: ai.extract
      description: "Classify the question and detect relevant entities."
      instruction: |
        From this question, extract:

        - intent (comparison, risk_assessment, contract_clause, pricing, RFQ_help, other)
        - primary_vendors (list of names)
        - time_horizon (e.g. "last 12 months")
        - requires_spend_data (boolean)
        - requires_contracts (boolean)
        - requires_risk_data (boolean)
        - required_outputs (list: summary, table, negotiation_points, email_draft, etc.)
      params:
        data:
          text: "{{ $form.question }}"
      expect:
        type: object
        properties:
          intent: { type: string }
          primary_vendors:
            type: array
            items: { type: string }
          time_horizon: { type: string }
          requires_spend_data: { type: boolean }
          requires_contracts: { type: boolean }
          requires_risk_data: { type: boolean }
          required_outputs:
            type: array
            items: { type: string }

    - id: answer_question
      type: ai.generate
      description: >
        Draft an answer from the analysis. NOTE: ai.generate does not call
        tools; to ground answers in contracts/spend/risk data, register custom
        tools and add explicit tool.call steps before this step, then pass
        their outputs in via $step(...).
      instruction: |
        You are a procurement copilot. Using only the provided analysis and any
        retrieved evidence passed in context, draft a clear answer. For any
        recommendation, explain the reasoning and evidence. When the question
        asks for negotiation support, identify 3–5 negotiation levers and tie
        each to concrete data. Always include a short "How to double-check
        this" section at the end.
      params:
        data:
          question: "{{ $form.question }}"
          analysis: "{{ $step('analyze_question') }}"
          category_hint: "{{ $form.category_hint }}"
      expect:
        type: object
        properties:
          output:
            type: string
        required: [output]

    - id: store_report
      type: tool.call
      tool: artifact.store
      description: "Persist a JSON report for later retrieval or audit."
      params:
        name: "procurement_copilot_report"
        content_type: json
        content:
          question: "{{ $form.question }}"
          analysis: "{{ $step('analyze_question') }}"
          answer_markdown: "{{ $step('answer_question') }}"
          vendors: "{{ $step('analyze_question').primary_vendors }}"
          time_horizon: "{{ $step('analyze_question').time_horizon }}"

policies:
  budget_usd: 1.50
  pii:
    allow: false

credentials:
  uses:
    - erp_api_token
    - contracts_rag_token
    - supplier_risk_api_token
