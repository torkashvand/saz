meta:
  id: change_approval_ansible
  title: "Change Approval with Ansible"
  description: >-
    Wedge demo. A change request is intaken, AI summarizes the blast radius and
    risk, Ansible runs in check (dry-run) mode against a bundled safe
    playbook, a human approves, and only then Ansible runs in apply mode.
    Demonstrates the canonical "AI proposes, human approves, deterministic tool
    executes, every action audited" loop.
  tags: ["wedge-demo", "change-management", "ansible", "approval", "sre", "recommended"]
  complexity: "advanced"
  recommended: true

schema_version: 1

flow:
  name: change_approval_ansible
  version: "1.0"
  description: >-
    Change-request intake → AI risk summary → Ansible check → human approval →
    Ansible apply, with every step audited. Ships with a safe, idempotent
    localhost playbook so the demo runs end-to-end without real infrastructure.

form:
  fields:
    - name: change_title
      type: string
      required: true
      description: Short change title (e.g. "Rotate API gateway TLS cert")
    - name: target_environment
      type: string
      required: true
      enum: [dev, staging, prod]
      description: Target environment
    - name: target_hosts
      type: string
      required: true
      description: >-
        A single Ansible host pattern (not a list). Use ":" to combine groups
        and "&" / "!" to intersect or exclude. Examples: localhost — web* —
        web*:edge — webservers:&prod.
    - name: requested_action
      type: text
      required: true
      description: Plain-English description of what the change does
    - name: maintenance_window
      type: string
      required: true
      description: Maintenance window (e.g. "2026-05-20 02:00–04:00 UTC")
    - name: rollback_plan
      type: text
      required: true
      description: How to roll back if the change misbehaves
    - name: risk_hint
      type: string
      required: false
      enum: [low, medium, high]
      description: Requester's risk guess; the AI may revise it
    - name: requester
      type: string
      required: true
      format: email
      description: Email of the requester (audit trail)

workflow:
  planner_mode: deterministic
  steps:
    - id: summarize_change
      type: ai.extract
      instruction: |
        You are reviewing an Ansible-backed change request before any
        execution. Read the request and produce a single JSON object
        conforming exactly to the expected schema.

        Rules:
        - "blast_radius" must be a short factual phrase ("single localhost"
          for the demo, or e.g. "12 prod web hosts").
        - "risk_level" should be "high" whenever target_environment is "prod",
          unless the requested change is read-only.
        - "pre_checks" is a short ordered list (3-6 items) of things the
          operator should verify before approval (e.g. "confirm backup
          completed in last 24h", "verify maintenance window approved").
        - "approval_recommendation" is your honest call: "approve" only if
          the change appears low-risk, dry-run-checkable, and within the
          stated window; otherwise "review_required" or "reject".
        - Never propose to bypass approval.
      params:
        data:
          change_title: "{{ $form.change_title }}"
          target_environment: "{{ $form.target_environment }}"
          target_hosts: "{{ $form.target_hosts }}"
          requested_action: "{{ $form.requested_action }}"
          maintenance_window: "{{ $form.maintenance_window }}"
          rollback_plan: "{{ $form.rollback_plan }}"
          risk_hint: "{{ $form.risk_hint }}"
          requester: "{{ $form.requester }}"
      expect:
        type: object
        additionalProperties: false
        properties:
          change_intent:
            type: string
            description: One-sentence restatement of what is being changed
          affected_targets:
            type: array
            items: { type: string }
          risk_level:
            type: string
            enum: [low, medium, high, critical]
          blast_radius:
            type: string
          pre_checks:
            type: array
            items: { type: string }
            minItems: 1
          rollback_summary:
            type: string
          approval_recommendation:
            type: string
            enum: [approve, review_required, reject]
          reasoning:
            type: string
        required:
          - change_intent
          - affected_targets
          - risk_level
          - blast_radius
          - pre_checks
          - rollback_summary
          - approval_recommendation
          - reasoning
      temperature: 0.1
      max_tokens: 700

    - id: ansible_check
      type: tool.call
      tool: ansible_run
      description: >-
        Dry-run the bundled demo playbook in --check mode against the
        operator-specified target hosts. Check mode applies nothing to any
        host; Ansible still reports changed=true for tasks that would change
        state, which is the expected dry-run result.
        Defaults to the bundled safe localhost playbook; override via
        SAZ_DEMO_ANSIBLE_PLAYBOOK / SAZ_DEMO_ANSIBLE_INVENTORY to target
        your own infrastructure.
      params:
        mode: check
        playbook: "{{ $env('SAZ_DEMO_ANSIBLE_PLAYBOOK', 'saz/examples/ansible/demo_change.yml') }}"
        inventory: "{{ $env('SAZ_DEMO_ANSIBLE_INVENTORY', 'saz/examples/ansible/demo_inventory.ini') }}"
        limit: "{{ $form.target_hosts }}"
        extra_vars:
          target_env: "{{ $form.target_environment }}"
          change_id: "{{ $form.change_title }}"
      expect:
        type: object
        properties:
          status: { type: string }
          mode: { type: string }
          changed: { type: boolean }
          artifact_id: { type: string }
          stdout_preview: { type: string }
          recap:
            type: object
            properties:
              ok: { type: integer }
              changed: { type: integer }
              unreachable: { type: integer }
              failed: { type: integer }
              skipped: { type: integer }
              rescued: { type: integer }
              ignored: { type: integer }

    - id: store_dryrun_artifact
      type: artifact.store
      description: >-
        Persist the dry-run recap and AI summary as an audit artifact, so the
        approver and any reviewer can see exactly what was proposed.
      params:
        name: "change_dryrun_record"
        content_type: json
        content:
          requester: "{{ $form.requester }}"
          change_title: "{{ $form.change_title }}"
          environment: "{{ $form.target_environment }}"
          target_hosts: "{{ $form.target_hosts }}"
          maintenance_window: "{{ $form.maintenance_window }}"
          rollback_plan: "{{ $form.rollback_plan }}"
          ai_summary: "{{ $step('summarize_change') }}"
          dry_run:
            status: "{{ $step('ansible_check').status }}"
            mode: "{{ $step('ansible_check').mode }}"
            changed: "{{ $step('ansible_check').changed }}"
            recap: "{{ $step('ansible_check').recap }}"
            artifact_id: "{{ $step('ansible_check').artifact_id }}"

    - id: request_approval
      type: human.approval
      description: >-
        Pause for an operator to approve or reject the change. The approval
        panel surfaces the AI summary and the dry-run recap from earlier
        steps. Apply mode runs only on approval.
      params:
        title: "Approve change: {{ $form.change_title }}"
        message: >-
          Requester: {{ $form.requester }}
          Environment: {{ $form.target_environment }}
          Hosts: {{ $form.target_hosts }}
          Window: {{ $form.maintenance_window }}
          AI risk: {{ $step('summarize_change').risk_level }}
          AI recommendation: {{ $step('summarize_change').approval_recommendation }}
          Dry-run status: {{ $step('ansible_check').status }}
          Dry-run changed: {{ $step('ansible_check').changed }}
        approvers:
          - "{{ $form.requester }}"

    - id: ansible_apply
      type: tool.call
      tool: ansible_run
      description: >-
        Apply the change with the same bundled playbook. Only reachable after
        the human approval gate. Same inputs as the check step, so the apply
        cannot drift from what the approver reviewed.
      params:
        mode: apply
        playbook: "{{ $env('SAZ_DEMO_ANSIBLE_PLAYBOOK', 'saz/examples/ansible/demo_change.yml') }}"
        inventory: "{{ $env('SAZ_DEMO_ANSIBLE_INVENTORY', 'saz/examples/ansible/demo_inventory.ini') }}"
        limit: "{{ $form.target_hosts }}"
        extra_vars:
          target_env: "{{ $form.target_environment }}"
          change_id: "{{ $form.change_title }}"
      expect:
        type: object
        properties:
          status: { type: string }
          mode: { type: string }
          changed: { type: boolean }
          artifact_id: { type: string }
          stdout_preview: { type: string }
          recap:
            type: object
            properties:
              ok: { type: integer }
              changed: { type: integer }
              unreachable: { type: integer }
              failed: { type: integer }
              skipped: { type: integer }
              rescued: { type: integer }
              ignored: { type: integer }

    - id: store_change_record
      type: artifact.store
      description: >-
        Final audit record. Includes the AI summary, the dry-run recap, the
        approval payload, and the apply recap. This is the demo's "every
        action auditable" artifact.
      params:
        name: "change_executed_record"
        content_type: json
        content:
          requester: "{{ $form.requester }}"
          change_title: "{{ $form.change_title }}"
          environment: "{{ $form.target_environment }}"
          target_hosts: "{{ $form.target_hosts }}"
          maintenance_window: "{{ $form.maintenance_window }}"
          rollback_plan: "{{ $form.rollback_plan }}"
          ai_summary: "{{ $step('summarize_change') }}"
          approval: "{{ $step('request_approval') }}"
          dry_run:
            status: "{{ $step('ansible_check').status }}"
            recap: "{{ $step('ansible_check').recap }}"
            artifact_id: "{{ $step('ansible_check').artifact_id }}"
          apply:
            status: "{{ $step('ansible_apply').status }}"
            recap: "{{ $step('ansible_apply').recap }}"
            artifact_id: "{{ $step('ansible_apply').artifact_id }}"
            changed: "{{ $step('ansible_apply').changed }}"

policies:
  budget_usd: 0.20
  defaults:
    timeout_ms: 600000
    continue_on_fail: false
  pii:
    # PII is blocked by default everywhere else. The artifact.store steps
    # below are the run's audit record — they must preserve requester /
    # approver identity for the change to be traceable. Operators opt in
    # explicitly per path so this isn't a blanket override.
    allow: false
    exceptions:
      tools:
        artifact.store:
          allow:
            - content.requester
            - content.approval