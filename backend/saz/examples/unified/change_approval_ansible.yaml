meta:
  id: change_approval_ansible
  title: "Change Approval with Ansible Execution"
  description: "Deterministic change approval workflow with human approval gate and automated Ansible playbook execution"
  tags: ["change-management", "ansible", "approval", "deterministic"]
  complexity: "advanced"
  recommended: true

schema_version: 1

flow:
  name: change_approval_ansible
  version: "1.0"
  description: Change request approval and automated deployment via Ansible

form:
  fields:
    - name: change_description
      type: string
      required: true
      description: Description of the proposed change
    - name: target_environment
      type: string
      required: true
      description: Target environment (dev, staging, prod)
    - name: playbook_name
      type: string
      required: true
      description: Ansible playbook to execute
    - name: requester_email
      type: string
      required: true
      description: Email of person requesting the change
      format: email

triggers:
  manual: true

workflow:
  planner_mode: deterministic
  steps:
    - id: assess_risk
      type: ai.extract
      instruction: |
        Assess the risk level of this change request.
        Consider the target environment, scope of change, and potential impact.
        Classify as: low, medium, high, critical
      params:
        data:
          description: "{{ $form.change_description }}"
          environment: "{{ $form.target_environment }}"
          playbook: "{{ $form.playbook_name }}"
      schema:
        type: object
        properties:
          risk_level:
            type: string
            enum: [low, medium, high, critical]
          reasoning:
            type: string
          requires_manager_approval:
            type: boolean
        required: [risk_level, requires_manager_approval]
      temperature: 0.1
      max_tokens: 512

    - id: generate_change_summary
      type: ai.generate
      instruction: |
        Generate a concise change summary for the approval request.
        Include: what's changing, why, expected impact, and rollback plan.
        Format as bullet points, max 150 words.
      params:
        data:
          description: "{{ $form.change_description }}"
          environment: "{{ $form.target_environment }}"
          risk: "{{ $step('assess_risk') }}"
      word_cap: 150
      temperature: 0.3
      max_tokens: 512

    - id: request_approval
      type: human.approval
      description: Request approval from operations team before executing change
      params:
        title: "Change Approval Required"
        description: "{{ $step('generate_change_summary') }}"
        context:
          environment: "{{ $form.target_environment }}"
          risk_level: "{{ $step('assess_risk').risk_level }}"
          playbook: "{{ $form.playbook_name }}"
          requester: "{{ $form.requester_email }}"
        approvers:
          - ops-team@example.com
        timeout_minutes: 1440

    - id: execute_ansible_playbook
      type: tool.call
      tool: http_request
      description: Trigger Ansible Tower/AWX job
      params:
        method: POST
        url: "https://ansible-tower.example.com/api/v2/job_templates/{{ $form.playbook_name }}/launch/"
        headers:
          Authorization: "Bearer {{ $secret('ansible_tower_token') }}"
        body:
          extra_vars:
            environment: "{{ $form.target_environment }}"
            change_id: "{{ $env('RUN_ID') }}"
            requester: "{{ $form.requester_email }}"
      expect:
        type: object
        properties:
          job:
            type: number

    - id: wait_for_completion
      type: webhook.wait
      description: Wait for Ansible job completion callback
      params:
        event_name: "ansible.job_complete"
        timeout_minutes: 60
        webhook_path: "/ansible/callback"
        expected_payload:
          job_id: "{{ $step('execute_ansible_playbook').job }}"

    - id: notify_completion
      type: tool.call
      tool: http_request
      description: Send completion notification
      params:
        method: POST
        url: "https://hooks.slack.com/services/{{ $secret('slack_webhook_id') }}"
        body:
          text: |
            ✅ Change completed successfully
            Environment: {{ $form.target_environment }}
            Playbook: {{ $form.playbook_name }}
            Requester: {{ $form.requester_email }}
            Job: {{ $step('execute_ansible_playbook').job }}
      expect:
        type: object

    - id: store_change_record
      type: artifact.store
      description: Store complete change execution record for audit trail
      params:
        name: "change_{{ $env('RUN_ID') }}"
        content:
          requester: "{{ $form.requester_email }}"
          environment: "{{ $form.target_environment }}"
          playbook: "{{ $form.playbook_name }}"
          risk_assessment: "{{ $step('assess_risk') }}"
          approval: "{{ $step('request_approval') }}"
          ansible_job: "{{ $step('execute_ansible_playbook').job }}"
          completed_at: "{{ $env('TIMESTAMP') }}"

policies:
  budget_usd: 0.20
  defaults:
    timeout_ms: 300000
    continue_on_fail: false
  pii:
    allow: false

credentials:
  uses: [ansible_tower_token, slack_webhook_id]
