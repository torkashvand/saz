schema_version: 1

flow:
  name: procurement_copilot_question
  version: "1.0"
  description: >
    Agentic procurement copilot. Given a free-text question, the planner can
    call RAG and ERP tools to answer with evidence and recommendations.

form:
  fields:
    - name: question
      type: string
      required: true
      description: "Ask anything about vendors, contracts, spend or risk."

    - name: category_hint
      type: string
      required: false
      description: "Optional: spend category (e.g. SaaS, network, consulting)."

workflow:
  planner_mode: agentic

  # In agentic mode, steps are more like "capabilities" the planner can use.
  # Saz will turn this into a tool-using plan based on the question + policies.

  steps:
    # 1) Understand the question and decide useful tools
    - id: analyze_question
      type: ai.extract
      description: "Classify the question and detect relevant entities."
      instruction: |
        From this question, extract:

        - intent (comparison, risk_assessment, contract_clause, pricing, RFQ_help, other)
        - primary_vendors (list of names)
        - time_horizon (e.g. "last 12 months")
        - requires_spend_data (boolean)
        - requires_contracts (boolean)
        - requires_risk_data (boolean)
        - required_outputs (list: summary, table, negotiation_points, email_draft, etc.)
      params:
        data:
          text: "{{ $form.question }}"
      expect:
        type: object
        properties:
          intent: { type: string }
          primary_vendors:
            type: array
            items: { type: string }
          time_horizon: { type: string }
          requires_spend_data: { type: boolean }
          requires_contracts: { type: boolean }
          requires_risk_data: { type: boolean }
          required_outputs:
            type: array
            items: { type: string }

    # 2) Agentic reasoning + tool use
    - id: answer_question
      type: ai.generate
      description: >
        Agentic step: plan which tools to call (contracts_search, erp_spend_query,
        supplier_risk_lookup) and synthesise an answer.
      instruction: |
        You are a procurement copilot with tool access.

        Goal:
        - Answer the user's question using *only* internal data via the provided tools.
        - Prefer citations from contracts and real spend data over guesses.
        - For any recommendation, explain the reasoning and evidence.

        Tools you can call (through the Saz tool registry):

        - contracts_search(query, vendors, time_horizon)
          Searches contracts, MSAs, NDAs and returns relevant passages.

        - erp_spend_query(vendors, time_horizon, category_hint)
          Returns aggregated spend, PO, and invoice history.

        - supplier_risk_lookup(vendors)
          Returns risk scores, SLA breaches and incidents.

        - artifact_store(name, json_payload)
          Stores a structured report linked to this run.

        Use multiple tool calls if needed; you may call the same tool more than once
        with different parameters. Stop when you have enough evidence.

        When the question asks for negotiation support:
        - Identify 3–5 negotiation levers (e.g. volume, term, SLA penalties).
        - Tie each lever back to concrete data (spend trend, SLA issues, benchmarks).

        Always include a short "How to double-check this" section at the end.
      params:
        context:
          question: "{{ $form.question }}"
          analysis: "{{ $step('analyze_question') }}"
          category_hint: "{{ $form.category_hint }}"
        tools:
          - contracts_search
          - erp_spend_query
          - supplier_risk_lookup
          - artifact_store
      expect:
        type: object
        properties:
          output:
            type: string
        required: [output]

    # 3) Store a structured report as artifact
    - id: store_report
      type: tool.call
      tool: artifact_store
      description: "Persist a JSON report for later retrieval or audit."
      params:
        name: "procurement_copilot_report"
        payload:
          question: "{{ $form.question }}"
          analysis: "{{ $step('analyze_question') }}"
          answer_markdown: "{{ $step('answer_question') }}"
          vendors: "{{ $step('analyze_question').primary_vendors }}"
          time_horizon: "{{ $step('analyze_question').time_horizon }}"

policies:
  budget_usd: 1.50
  defaults:
    timeout_ms: 240000
    continue_on_fail: false

  pii:
    allow: false
    # You could add allow-lists here if, for example, supplier PII is allowed
    # to flow into specific tools but not into logs.

credentials:
  uses:
    - erp_api_token
    - contracts_rag_token
    - supplier_risk_api_token
